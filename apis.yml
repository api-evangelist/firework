aid: firework
name: Firework
description: >-
  Firework is a video commerce platform that helps brands and retailers bring the
  in-store experience and human connection online through shoppable short-form
  video, livestream shopping, 1:1 video chat, digital showrooms, and an AI shopping
  agent. Operated by Loop Now Technologies and backed by SoftBank (a $150M Series C
  led SoftBank's investment), Firework powers 1,500+ global brands and has driven
  $300M+ in GMV across 2+ trillion video views. For developers it offers a Web SDK,
  native Android/iOS SDKs, React Native and Flutter plugins, embeddable web
  components (Hero Unit, Carousel, Player Deck, Storyblock, Floating Player), a
  server-side REST Public API (https://api.firework.com/api/v1) secured with OAuth 2.0
  (client credentials and authorization-code + PKCE with dynamic client registration),
  HMAC-signed webhooks, and turnkey commerce-platform integrations for Shopify,
  Magento, WooCommerce, Salesforce Commerce Cloud, and BigCommerce.
